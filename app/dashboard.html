<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14;
      --panel: #111823;
      --panel-2: #172130;
      --line: #253244;
      --text: #eef3f8;
      --muted: #8fa0b3;
      --accent: #f0883e;
      --accent-2: #ffad6b;
      --danger: #ff6b6b;
      --ok: #59d890;
      --warn: #f3c969;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 272px 1fr;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #0d131c;
      padding: 22px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent);
      box-shadow: 0 0 24px rgba(240, 136, 62, 0.28);
    }

    nav {
      display: grid;
      gap: 6px;
    }

    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 9px 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }

    .nav-button.active, .nav-button:hover {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
    }

    main {
      padding: 28px;
      overflow: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      margin-top: 4px;
    }

    button, input {
      font: inherit;
    }

    .primary, .ghost {
      min-height: 38px;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid var(--line);
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #111;
      font-weight: 700;
    }

    .primary:hover { background: var(--accent-2); }

    .ghost {
      background: var(--panel);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
    }

    .card, .form-panel, .settings-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .card {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .provider-name {
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .url {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
      margin-top: 3px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .badge.connected { color: var(--ok); border-color: rgba(89, 216, 144, 0.45); }
    .badge.busy { color: var(--warn); border-color: rgba(243, 201, 105, 0.45); }
    .badge.error { color: var(--danger); border-color: rgba(255, 107, 107, 0.45); }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .meta span {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      overflow-wrap: anywhere;
    }

    .view { display: none; }
    .view.active { display: block; }

    .form-panel, .settings-panel {
      max-width: 760px;
      padding: 18px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 100%;
      min-height: 38px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #0c121a;
      color: var(--text);
      padding: 8px 10px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .error-text {
      color: var(--danger);
      font-size: 12px;
      min-height: 18px;
    }

    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="mark"></span><span>API Bridge</span></div>
      <nav>
        <button class="nav-button active" data-view-button="providers">Providers</button>
        <button class="nav-button" data-view-button="add">Add Provider</button>
        <button class="nav-button" data-view-button="settings">Settings</button>
      </nav>
    </aside>
    <main>
      <section class="view active" data-view="providers">
        <div class="topbar">
          <div>
            <h1>Providers</h1>
            <div class="subtle">Login once per provider, then use the local OpenAI-compatible endpoint.</div>
          </div>
          <button class="ghost" id="refresh">Refresh</button>
        </div>
        <div class="grid" id="providerGrid"></div>
      </section>

      <section class="view" data-view="add">
        <div class="topbar">
          <div>
            <h1>Add Provider</h1>
            <div class="subtle">Create a DOM-mode provider config in data/providers.</div>
          </div>
        </div>
        <div class="form-panel">
          <form id="providerForm">
            <div class="two">
              <label>Name<input name="name" placeholder="perplexity" required pattern="[a-zA-Z0-9_-]+"></label>
              <label>Display Name<input name="display_name" placeholder="Perplexity" required></label>
            </div>
            <label>URL<input name="url" placeholder="https://example.com/chat" required></label>
            <label>Input Selector<input name="input_selector" placeholder="textarea, [contenteditable='true']" required></label>
            <label>Send Button Selector<input name="send_button_selector" placeholder="button[type='submit']"></label>
            <label>Response Selector<input name="response_selector" placeholder=".markdown, [data-message-author-role='assistant']" required></label>
            <label>Response Text Selector<input name="response_text_selector" placeholder=".markdown"></label>
            <label>Network Stream URL Pattern<input name="stream_url_pattern" placeholder="/api/chat"></label>
            <div class="error-text" id="formError"></div>
            <button class="primary" type="submit">Add Provider</button>
          </form>
        </div>
      </section>

      <section class="view" data-view="settings">
        <div class="topbar">
          <div>
            <h1>Settings</h1>
            <div class="subtle">Runtime values read from environment and local defaults.</div>
          </div>
        </div>
        <div class="settings-panel" id="settingsPanel"></div>
      </section>
    </main>
  </div>

  <script>
    const grid = document.querySelector("#providerGrid");
    const settingsPanel = document.querySelector("#settingsPanel");
    const form = document.querySelector("#providerForm");
    const formError = document.querySelector("#formError");

    document.querySelectorAll("[data-view-button]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-view-button]").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll("[data-view]").forEach((v) => v.classList.remove("active"));
        button.classList.add("active");
        document.querySelector(`[data-view="${button.dataset.viewButton}"]`).classList.add("active");
      });
    });

    document.querySelector("#refresh").addEventListener("click", loadProviders);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      formError.textContent = "";
      const data = Object.fromEntries(new FormData(form).entries());
      Object.keys(data).forEach((key) => {
        if (data[key] === "") delete data[key];
      });
      const response = await fetch("/api/providers", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data),
      });
      if (!response.ok) {
        formError.textContent = await response.text();
        return;
      }
      form.reset();
      await loadProviders();
      document.querySelector('[data-view-button="providers"]').click();
    });

    async function login(name) {
      await fetch(`/api/providers/${encodeURIComponent(name)}/login`, {method: "POST"});
      await loadProviders();
    }

    async function loadProviders() {
      const response = await fetch("/api/providers");
      const payload = await response.json();
      grid.innerHTML = payload.providers.map((provider) => card(provider)).join("");
      settingsPanel.innerHTML = `
        <div class="meta">
          <span>Port<br><strong>${payload.settings.port}</strong></span>
          <span>Default model<br><strong>${payload.settings.default_model}</strong></span>
        </div>
      `;
      document.querySelectorAll("[data-login]").forEach((button) => {
        button.addEventListener("click", () => login(button.dataset.login));
      });
      document.querySelectorAll("[data-save]").forEach((button) => {
        button.addEventListener("click", () => saveSession(button.dataset.save));
      });
    }

    async function saveSession(name) {
      await fetch(`/api/providers/${encodeURIComponent(name)}/session`, {method: "POST"});
      await loadProviders();
    }

    function card(provider) {
      const status = provider.status || "disconnected";
      const error = provider.error ? `<div class="error-text">${escapeHtml(provider.error)}</div>` : "";
      return `
        <article class="card">
          <div class="card-head">
            <div>
              <div class="provider-name">${escapeHtml(provider.display_name)}</div>
              <div class="url">${escapeHtml(provider.url)}</div>
            </div>
            <span class="badge ${status}">${status}</span>
          </div>
          <div class="meta">
            <span>Model<br><strong>${escapeHtml(provider.name)}</strong></span>
            <span>Mode<br><strong>${escapeHtml(provider.mode)}</strong></span>
          </div>
          ${error}
          <button class="primary" data-login="${escapeHtml(provider.name)}">Login</button>
          <button class="ghost" data-save="${escapeHtml(provider.name)}">Save Session</button>
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    loadProviders();
  </script>
</body>
</html>
